        </p>

          <li><strong>Interactive Campus Route Maps:</strong> Detailed stop sequences from Kottayam, Kanjirappally, Kidangoor to College of Engineering Poonjar (CEP).</li>
          <li><strong>Digital QR Transit Passes:</strong> Color-coded, authenticated student passes with cryptographic verification.</li>

        </ul>

        <h2 style="color: #38bdf8; margin-top: 2rem;">Frequently Asked Questions (FAQ)</h2>

        <p style="color: #94a3b8;">Open HopSpot on any phone or computer, select your route or pickup stop, and view live bus markers moving in real-time.</p>

        <h3 style="color: #e2e8f0;">How do digital student passes work?</h3>
        <p style="color: #94a3b8;">Log in with your student ID to view your digital QR transit pass. Drivers scan this pass upon boarding to confirm route eligibility.</p>
